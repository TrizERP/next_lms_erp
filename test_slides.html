<!doctype html>
<html>
<head>
<style>
@page { size: 16in 9in; margin: 0; }
body { margin: 0; font-family: sans-serif; }
.slide { width: 16in; height: 9in; page-break-after: always; padding: 1in; box-sizing: border-box; }
.slide:last-child { page-break-after: auto; }
.s1 { background: #1e1b4b; color: white; }
.s2 { background: #f8fafc; color: #0f172a; }
.s3 { background: #042f2e; color: white; }
</style>
</head>
<body>
<div class="slide s1"><h1>Slide 1</h1><p>First slide</p></div>
<div class="slide s2"><h1>Slide 2</h1><p>Second slide</p></div>
<div class="slide s3"><h1>Slide 3</h1><p>Third slide</p></div>
</body>
</html>
