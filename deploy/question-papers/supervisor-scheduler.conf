; OPTIONAL: run the Laravel scheduler persistently under Supervisor, INSTEAD OF the cron line.
; Use exactly ONE of the two. If the host already has `* * * * * php artisan schedule:run` in cron, do not install this.
;
; The scheduler is what runs `idms:dispatch-question-papers` every minute (app/Console/Kernel.php): the recovery pass
; that re-queues a paper whose queue message was lost or whose worker died. It only enqueues; the extraction itself
; always runs on the question-papers worker.
;
; NOTE: `schedule:work` runs EVERY scheduled task of the application, exactly as the cron line would (notifications,
; Neo4j, alumni, PAL tagging, ...). That is how production already runs them; it is not specific to question papers.
; This is why the development launcher (dev-question-papers.ps1) does NOT use it.
;
; TEMPLATE: __APP_PATH__, __PHP_BIN__, __RUN_USER__ are UNCONFIRMED (see "Host discovery" in
; docs/QUESTION_PAPER_DEPLOYMENT_RUNBOOK.md). Same user and same .env as the web app and the worker.
;
; Install: copy to Supervisor's conf.d, fill the placeholders, then
;   supervisorctl reread && supervisorctl update && supervisorctl status laravel-scheduler

[program:laravel-scheduler]
command=__PHP_BIN__ __APP_PATH__/artisan schedule:work
directory=__APP_PATH__
user=__RUN_USER__
numprocs=1
autostart=true
autorestart=true
; startsecs=0: see supervisor-question-papers.conf (a crash at boot is retried for ever, never left FATAL).
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
