; Persistent queue worker for Question Paper extraction (Supervisor).
;
; TEMPLATE: every value marked __LIKE_THIS__ is UNCONFIRMED and must be filled in from the real host
; (see "Host discovery" in docs/QUESTION_PAPER_DEPLOYMENT_RUNBOOK.md). The repository does not say where
; or how the production backend runs, so no path, PHP binary or user below can be assumed.
;
;   __APP_PATH__   directory that contains `artisan` and the production .env
;   __PHP_BIN__    the PHP 8.2+ CLI the web app uses (NOT necessarily the first `php` on PATH)
;   __RUN_USER__   the OS user that owns the app files and runs the web app / scheduler
;
; Runs ONLY the `question_papers` connection / `question-papers` queue (config/queue.php), so it never
; picks up unrelated jobs waiting in the `default` queue (e.g. GenerateCoursePresentationJob).
;
; Install:  copy to Supervisor's conf.d directory, fill the placeholders, then
;           supervisorctl reread && supervisorctl update && supervisorctl status
; After every deploy:  __PHP_BIN__ artisan queue:restart   (workers finish the current job, then reload code)
;
; --timeout must stay BELOW retry_after (1000) and match QuestionPaperExtractionJob::$timeout (900).
; stopwaitsecs must exceed --timeout so a stop/restart lets the running extraction finish.
; The worker must run with the SAME .env (database, QUEUE_CONNECTION, AI provider config, Spaces disk)
; as the web app: run it from __APP_PATH__ as __RUN_USER__.

[program:question-papers-worker]
process_name=%(program_name)s_%(process_num)02d
command=__PHP_BIN__ __APP_PATH__/artisan queue:work question_papers --queue=question-papers --sleep=3 --tries=6 --timeout=900 --max-time=3600
directory=__APP_PATH__
user=__RUN_USER__
numprocs=1
autostart=true
autorestart=true
; startsecs=0: a worker that dies at boot (e.g. the database is not up yet after a reboot) is restarted for ever. With a
; positive startsecs, Supervisor gives up after startretries (3) and marks it FATAL, and nothing would bring it back.
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/log/supervisor/question-papers-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
