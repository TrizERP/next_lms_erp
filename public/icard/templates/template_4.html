<style>
    br {
        display: block;
    }
    @media print {
        *,
        *::before,
        *::after {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Prevent content from breaking awkwardly */
        .page-break-clear {
            clear: both;
        }

        .page-break {
            display: block !important;
            height: 0;
            break-after: page;
            page-break-after: always; /* Legacy browser support */
        }
        .row-4-column-1{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 4fr;
            grid-column-gap: 10px;
            grid-row-gap: 5px;
            width: 48vh;
            margin-right: auto;
            margin-left: auto;
        }
        .row-2-column-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            grid-column-gap: 10px;
            grid-row-gap: 5px;
            width: 48vh;
            margin-right: auto;
            margin-left: auto;
        }
        .row-1-column-1 {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            grid-column-gap: 10px;
            grid-row-gap: 5px;
            width: 48vh;
            margin-right: auto;
            margin-left: auto;
        } 
        .row-3-column-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-column-gap: 10px;
            grid-row-gap: 5px;
            width: 48vh;
            margin-right: auto;
            margin-left: auto;
        }
        .row-3-column-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-column-gap: 10px;
            grid-row-gap: 5px;
            width: 48vh;
            margin-right: auto;
            margin-left: auto;
        }
        .icard-item{
             /*content:url(http://dev.triz.co.in/icard/templates/card-bg.jpg); */
             /*background: url(http://dev.triz.co.in/icard/templates/card-bg.jpg) !important; */
            background-size: 100% !important;
            background-repeat: no-repeat !important;
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            position: relative;
        }
        .row-4-column-1 .item:nth-child(3) > div .icard-item {
            margin-top: -2px;
        }
        .icard-item > img{
            max-width: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #printPage::before {
            content: "";
            /*background: #000000;*/
            width: 800px;
            height: 1387px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .item{
            position: relative;
            z-index: 9;
        }
    }
</style>

<body>
